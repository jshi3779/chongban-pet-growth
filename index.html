<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>宠伴 · 养宠成长记录</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top"><div><h1>宠伴</h1><div class="sub">记录每一个小小的成长瞬间</div></div><div class="circ">🔔</div></header>

  <main id="view"></main>

  <nav class="tabbar">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><circle cx="6.5" cy="10" r="1.8"/><circle cx="10" cy="5.8" r="1.8"/><circle cx="14.5" cy="5.8" r="1.8"/><circle cx="18" cy="10" r="1.8"/><path d="M12 12.5c-3 0-5.5 2.6-5.5 4.8 0 1.6 1.6 2.2 3 1.8 1-.3 1.6-.5 2.5-.5s1.5.2 2.500.5c1.400.4 3-.2 3-1.800 0-2.200-2.500-4.800-5.500-4.800z"/></svg><span>档案</span></button>
    <button data-tab="calendar"><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.500" rx="4"/><path d="M8 3.500v4M16 3.500v4M4 10.500h16"/></svg><span>日历</span></button>
    <button data-tab="timeline"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.500"/><path d="M12 7.500V12l3 2"/></svg><span>时间线</span></button>
    <button data-tab="community"><svg viewBox="0 0 24 24"><path d="M5 6.500A3.500 3.500 0 0 1 8.500 3h7A3.500 3.500 0 0 1 19 6.500v6a3.500 3.500 0 0 1-3.500 3.500H11l-4 3.500V16a3.500 3.500 0 0 1-2-3.200z"/></svg><span>社区</span></button>
  </nav>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="mask"></div>
  <form class="panel" id="form"></form>
</div>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
